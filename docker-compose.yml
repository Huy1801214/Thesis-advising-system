services:
  # 1. Redis: Message Broker (Broker) và State Store (Whiteboard) [cite: 630-635]
  redis:
    image: redis:7-alpine
    container_name: nlu_redis_bus
    ports:
      - "6379:6379"

  # 2. Qdrant: Cơ sở dữ liệu Vector cho RAG Agent [cite: 643]
  qdrant:
    image: qdrant/qdrant
    container_name: nlu_vector_db
    ports:
      - "6333:6333"

  # 3. Neo4j: Cơ sở dữ liệu Đồ thị cho GRAG Agent [cite: 644]
  neo4j:
    image: neo4j:latest
    container_name: nlu_graph_db
    environment:
      - NEO4J_AUTH=neo4j/password # Huy nhớ đổi password này cho khớp với code nhé
    ports:
      - "7474:7474"
      - "7687:7687"